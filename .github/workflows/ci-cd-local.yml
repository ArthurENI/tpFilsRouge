name: ci-cd-lical
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_DIALECT: mysql
      PORT: 3000

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm

    - name: Installer les dépendances
      run: npm ci

    - name: Lancer les tests unitaires + intégration
      run: npm test

   # ---------------------------------------------------------------
  # Job 2 : build + déploiement local via docker compose + smoke test
  # Ne se déclenche QUE sur push vers main, ET seulement si "test" a réussi
  # (needs: test => si test échoue, ce job est automatiquement skippé)
  # ---------------------------------------------------------------
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
 
    env:
      DB_HOST: db
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
 
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
 
      - name: Build + démarrage via docker compose
        run: docker compose up -d --build
 
      - name: Attendre le démarrage du backend
        run: sleep 10
 
      - name: Smoke test HTTP
        run: |
          curl -sf http://localhost:3000/api/tasks || {
            echo "Smoke test échoué, logs du backend :"
            docker compose logs app
            exit 1
          }
 
      - name: Nettoyage
        if: always()
        run: docker compose down -v




